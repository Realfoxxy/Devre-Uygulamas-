# Bağımlılık ve GitHub Actions güncellemeleri: ayda bir, tek bir toplu PR olarak açılır.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # büyük sürüm atlamaları (React 19, TypeScript 7 …) kod değişikliği ister: elle yapılır
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
